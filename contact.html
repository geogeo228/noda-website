    <style>
      /* Contact Page Specific Styles */
      .contact-container {
        max-width: 480px;
        margin: 0 auto;
        padding: 60px 24px 80px;
        text-align: center;
      }

      .profile-avatar {
        width: 120px;
        height: 120px;
        margin: 0 auto 24px;
        background: linear-gradient(135deg, var(--accent) 0%, rgba(16, 185, 129, 0.6) 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: 48px;
        font-weight: 600;
        color: var(--bg);
        letter-spacing: -0.02em;
        box-shadow: 0 8px 32px rgba(16, 185, 129, 0.3);
        position: relative;
        z-index: 1;
      }

      .profile-name {
        font-family: var(--font-display);
        font-size: 28px;
        font-weight: 600;
        margin: 0 0 8px;
        color: var(--text);
        letter-spacing: -0.02em;
      }

      .profile-role {
        font-size: 16px;
        color: var(--muted);
        margin: 0 0 24px;
        font-weight: 500;
      }

      .profile-bio {
        font-size: 16px;
        line-height: 1.6;
        color: var(--muted);
        margin: 0 0 40px;
        max-width: 400px;
        margin-left: auto;
        margin-right: auto;
      }

      .contact-links {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 32px;
      }

      .contact-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px 24px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        text-decoration: none;
        color: var(--text);
        font-weight: 500;
        font-size: 15px;
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
        min-height: 52px;
      }

      .contact-link::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, var(--accent-soft) 0%, transparent 100%);
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .contact-link:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(16, 185, 129, 0.15);
      }

      .contact-link:hover::before {
        opacity: 1;
      }

      .contact-link:active {
        transform: translateY(0);
      }

      .contact-link-icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        position: relative;
        z-index: 1;
      }

      .contact-link-text {
        position: relative;
        z-index: 1;
      }

      .contact-link-primary {
        background: linear-gradient(135deg, var(--accent) 0%, rgba(16, 185, 129, 0.8) 100%);
        border-color: var(--accent);
        color: var(--bg);
        font-weight: 600;
      }

      .contact-link-primary:hover {
        box-shadow: 0 8px 32px rgba(16, 185, 129, 0.4);
        transform: translateY(-2px);
      }

      .contact-link-primary::before {
        display: none;
      }

      .secondary-links {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
      }

      .secondary-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px;
        color: var(--muted);
        text-decoration: none;
        font-size: 14px;
        transition: color 0.2s ease;
      }

      .secondary-link:hover {
        color: var(--accent);
      }

      .secondary-link svg {
        width: 16px;
        height: 16px;
      }

      @media (max-width: 640px) {
        .contact-container {
          padding: 40px 20px 60px;
        }

        .profile-avatar {
          width: 100px;
          height: 100px;
          font-size: 40px;
        }

        .profile-name {
          font-size: 24px;
        }

        .profile-bio {
          font-size: 15px;
        }
      }
    </style>
