<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Дефолтные SEO-теги: нужны для краулеров, которые не выполняют JS
      (Telegram, WhatsApp и прочие превьюшки ссылок).
      На клиенте их снимает src/seo-defaults.js, чтобы после гидрации
      в head не осталось дублей рядом с тегами от Helmet.
      Канонический URL сюда не кладём: статический canonical на главную
      делал все внутренние страницы её дублями и выбивал их из индекса.
    -->
    <title data-default-seo>NODA — Комплексные IT и ИИ-решения для бизнеса</title>
    <meta data-default-seo name="description" content="Комплексные IT и ИИ-решения для бизнеса. Колдун-Бот для ивентов, мониторинг чатов, кастомные решения." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta data-default-seo property="og:title" content="NODA — Комплексные IT и ИИ-решения для бизнеса" />
    <meta data-default-seo property="og:description" content="IT и ИИ-решения. Колдун-Бот, мониторинг чатов, кастомные решения." />
    <meta data-default-seo property="og:url" content="https://noda-auto.com" />
    <meta property="og:image" content="https://noda-auto.com/assets/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ru_RU" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta data-default-seo name="twitter:title" content="NODA — Комплексные IT и ИИ-решения для бизнеса" />
    <meta data-default-seo name="twitter:description" content="IT и ИИ-решения. Колдун-Бот, мониторинг чатов, кастомные решения." />
    <meta name="twitter:image" content="https://noda-auto.com/assets/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23000' width='100' height='100' rx='20'/><text y='.9em' x='50%' text-anchor='middle' font-size='70'>⚡</text></svg>" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
