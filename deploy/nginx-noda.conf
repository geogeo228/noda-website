# Конфиг статики noda-auto.com после перехода на пререндер.
#
# Составлен из живого конфига сервера (бэкап: /root/nginx-backup-2026-09-26-1413.conf)
# с тремя изменениями. TLS-часть Let's Encrypt и редирект с 80 сохранены как есть.
#
# ВАЖНО о порядке применения: этот конфиг убирает SPA-fallback. Применять его
# можно ТОЛЬКО после того, как на сервер выкачена пререндеренная сборка —
# та, где есть /var/www/html/blog/<slug>/index.html и /var/www/html/404.html.
# На старой сборке он отдаст 404 на всех внутренних страницах.

server {
    server_name noda-auto.com www.noda-auto.com;

    root /var/www/html;
    index index.html;

    # Изменение 1. Было: try_files $uri $uri/ /index.html — любой несуществующий
    # путь отдавал главную с кодом 200, и для поисковика страница-призрак
    # выглядела валидной. Это soft 404, он же обесценивал пререндер.
    location / {
        try_files $uri $uri/index.html $uri/ =404;

        # HTML кэшировать нельзя: иначе правки статей доезжают до читателей
        # непредсказуемо долго. Заголовок стоит здесь, а не в location по
        # маске .html: страницы отдаются по адресам без расширения
        # (/blog/<slug>), try_files подставляет index.html, оставаясь внутри
        # этого location, и маска .html до них просто не доходит.
        add_header Cache-Control "no-cache" always;
    }

    # Изменение 2. Честная страница 404 с noindex.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Изменение 3. Заголовки кэша.
    # Ассеты Vite хэшированные — имя меняется вместе с содержимым.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Прямые обращения к .html — например, к /404.html через error_page.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/noda-auto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noda-auto.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = noda-auto.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name noda-auto.com www.noda-auto.com;
    return 404;
}
